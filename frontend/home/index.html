<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haim | Data-Driven Growth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #FAF9F6; 
            color: #111827; 
            margin: 0; 
            padding: 0; 
            line-height: 1.6; 
        }
        
        h1, .nav-links a { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        header { padding: 40px 40px 0 40px; border-bottom: 1px solid #E5E7EB; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .nav-links { display: flex; gap: 32px; padding-bottom: 16px; }
        .nav-links a { text-decoration: none; color: #64748B; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; transition: all 0.3s ease; padding-bottom: 16px; border-bottom: 2px solid transparent; }
        .nav-links a:hover { color: #0F172A; }
        .nav-links a.active { color: #EA580C; border-bottom: 2px solid #EA580C; }

        .container { max-width: 1200px; margin: 0 auto; padding: 80px 40px; box-sizing: border-box; }

        /* Restored Orange Pill Styling */
        .pill { 
            display: inline-block; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.8rem; 
            color: #EA580C; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-weight: 700;
            padding: 6px 16px; 
            border: 1px solid #FDBA74; 
            border-radius: 9999px; 
            background-color: rgba(253, 186, 116, 0.1); 
            margin-bottom: 32px;
        }
        
        /* Expanded Widths to Allow Flow Across the Canvas */
        h1 { 
            font-size: 4.25rem; 
            font-weight: 800; 
            margin: 0 0 24px 0; 
            letter-spacing: -1.5px; 
            color: #0F172A; 
            line-height: 1.1; 
            max-width: 1050px; 
        }

        p.body-text { 
            font-size: 1.25rem; 
            color: #475569; 
            margin-bottom: 0; 
            max-width: 950px; 
            line-height: 1.7; 
        }
        p.body-text strong { color: #EA580C; font-weight: 700; }

        @media (max-width: 768px) {
            header { padding: 20px 20px 0 20px; }
            .nav-links { gap: 16px; overflow-x: auto; white-space: nowrap; }
            .container { padding: 40px 20px; }
            h1 { font-size: 2.75rem; }
        }
    </style>
</head>
<body>

    <header>
        <nav class="nav-links">
            <a href="/home/" class="active">HOME</a>
            <a href="/about/">ABOUT</a>
            <a href="/products/">PRODUCTS</a>
            <a href="/services/">SERVICES</a>
        </nav>
    </header>

    <div class="container">
        <span class="pill">Data-Driven Growth Infrastructure</span>
        
        <h1>See what works for your competitors. Do it better.</h1>
        
        <p class="body-text">
            We turn competitor data into campaigns that <strong>grow</strong> your revenue. Leverage our suite of tools to move faster than your competitors.
        </p>
    </div>

</body>
</html>
