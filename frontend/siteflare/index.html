<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiteFlare | Haim International</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23EA580C'>∑</text></svg>">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAF9F6;
            color: #111827;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 24px; }
        
        /* Navigation */
        .back-link {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: #6B7280;
            text-decoration: none;
            text-transform: uppercase;
            margin-bottom: 40px;
            transition: color 0.2s;
        }
        .back-link:hover { color: #EA580C; }

        /* Header & Form */
        h1 { font-size: 3rem; font-weight: 700; margin: 0 0 16px 0; letter-spacing: -1px; }
        p.subtitle { font-size: 1.25rem; color: #4B5563; margin-bottom: 40px; }
        
        .search-box {
            display: flex;
            gap: 16px;
            margin-bottom: 40px;
        }
        input[type="url"] {
            flex: 1;
            padding: 16px 24px;
            font-size: 1.1rem;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        input[type="url"]:focus { border-color: #EA580C; }
        button {
            padding: 16px 32px;
            background-color: #EA580C;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #C2410C; }
        button:disabled { background-color: #FCA5A5; cursor: not-allowed; }

        /* Error Message */
        #error-message {
            display: none;
            background-color: #FEE2E2;
            color: #991B1B;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            border: 1px solid #F87171;
        }

        /* Results Dashboard */
        #results-dashboard { display: none; }
        .score-banner {
            background-color: #111827;
            color: white;
            border-radius: 12px;
            padding: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }
        .score-banner h2 { margin: 0 0 8px 0; font-size: 2rem; }
        .score-banner p { margin: 0; color: #9CA3AF; font-family: 'JetBrains Mono', monospace; }
        .grade-circle {
            background-color: rgba(234, 88, 12, 0.1);
            border: 2px solid #EA580C;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: #EA580C;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .card {
            background-color: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .card h3 { margin: 0 0 16px 0; font-size: 1.2rem; }
        .good-card h3 { color: #059669; }
        .bad-card h3 { color: #DC2626; }
        .card ul { padding-left: 20px; margin: 0; color: #4B5563; }
        .card li { margin-bottom: 12px; }

        @media (max-width: 768px) {
            .search-box { flex-direction: column; }
            .grid-layout { grid-template-columns: 1fr; }
            .score-banner { flex-direction: column; text-align: center; gap: 24px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="/" class="back-link">← Back to Haim International</a>
        
        <h1>SiteFlare Diagnostics</h1>
        <p class="subtitle">Run a quantitative audit on your marketing architecture and AI crawler readiness.</p>
        
        <form class="search-box" id="audit-form">
            <input type="url" id="url-input" placeholder="https://example.com" required>
            <button type="submit" id="submit-btn">Run Audit</button>
        </form>

        <div id="error-message"></div>

        <!-- Dynamic Results Dashboard -->
        <div id="results-dashboard">
            <div class="score-banner">
                <div>
                    <h2>Audit Complete</h2>
                    <p id="target-url">Target: </p>
                </div>
                <div style="display: flex; gap: 24px; align-items: center;">
                    <div style="text-align: right;">
                        <span id="total-score" style="display: block; font-size: 2.5rem; font-weight: 700; color: #EA580C;"></span>
                        <span style="font-size: 0.8rem; text-transform: uppercase; color: #9CA3AF; letter-spacing: 1px;">Total Score</span>
                    </div>
                    <div class="grade-circle" id="letter-grade"></div>
                </div>
            </div>

            <div class="grid-layout">
                <div class="card good-card">
                    <h3>✓ Where You're Good</h3>
                    <ul id="strengths-list"></ul>
                </div>
                <div class="card bad-card">
                    <h3>⚠ Action Items</h3>
                    <ul id="action-items-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('audit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = document.getElementById('url-input').value;
            const btn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-message');
            const dashboard = document.getElementById('results-dashboard');
            
            // UI Loading State
            btn.disabled = true;
            btn.textContent = "Analyzing...";
            errorDiv.style.display = "none";
            dashboard.style.display = "none";

            try {
                // Call your Python FastAPI Backend
                const response = await fetch("http://localhost:8000/api/audit", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || "Failed to audit the website.");
                }

                // Populate Dashboard
                const scorecard = data.scorecard;
                document.getElementById('target-url').textContent = "Target: " + url;
                document.getElementById('total-score').textContent = scorecard.total_score;
                document.getElementById('letter-grade').textContent = scorecard.letter_grade;

                // Populate Strengths
                const strengthsUl = document.getElementById('strengths-list');
                strengthsUl.innerHTML = "";
                if (scorecard.category_scores.ai_readiness >= 15) strengthsUl.innerHTML += "<li>AI Crawlers can access and parse content efficiently.</li>";
                if (scorecard.category_scores.performance >= 10) strengthsUl.innerHTML += "<li>Server load time is optimized.</li>";
                if (scorecard.category_scores.seo >= 15) strengthsUl.innerHTML += "<li>On-page SEO fundamentals are robust.</li>";
                if (strengthsUl.innerHTML === "") strengthsUl.innerHTML = "<li>No major strengths detected.</li>";

                // Populate Actions
                const actionsUl = document.getElementById('action-items-list');
                actionsUl.innerHTML = "";
                if (scorecard.recommendations.length > 0) {
                    scorecard.recommendations.forEach(rec => {
                        actionsUl.innerHTML += `<li>${rec}</li>`;
                    });
                } else {
                    actionsUl.innerHTML = "<li>No critical issues found. Your infrastructure is solid.</li>";
                }

                // Reveal Dashboard
                dashboard.style.display = "block";

            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = "block";
            } finally {
                // Reset Button
                btn.disabled = false;
                btn.textContent = "Run Audit";
            }
        });
    </script>
</body>
</html>
