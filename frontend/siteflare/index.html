<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiteFlare | Haim International</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23EA580C'>∑</text></svg>">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAF9F6; color: #111827; margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 24px; }
        
        .back-link {
            display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; 
            color: #6B7280; text-decoration: none; text-transform: uppercase; margin-bottom: 40px; transition: color 0.2s;
        }
        .back-link:hover { color: #EA580C; }

        h1 { font-size: 3rem; font-weight: 700; margin: 0 0 16px 0; letter-spacing: -1px; }
        p.subtitle { font-size: 1.25rem; color: #4B5563; margin-bottom: 40px; }
        
        .search-box { display: flex; gap: 16px; margin-bottom: 40px; }
        input[type="url"] {
            flex: 1; padding: 16px 24px; font-size: 1.1rem; border: 1px solid #E5E7EB; 
            border-radius: 8px; font-family: 'Inter', sans-serif; outline: none;
        }
        input[type="url"]:focus { border-color: #EA580C; }
        button {
            padding: 16px 32px; background-color: #EA580C; color: white; border: none; 
            border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background-color 0.2s;
            white-space: nowrap;
        }
        button:hover { background-color: #C2410C; }
        button:disabled { background-color: #FCA5A5; cursor: not-allowed; }

        #error-message {
            display: none; background-color: #FEE2E2; color: #991B1B; padding: 16px; 
            border-radius: 8px; margin-bottom: 24px; border: 1px solid #F87171;
        }

        #results-dashboard { display: none; }
        .score-banner {
            background-color: #111827; color: white; border-radius: 12px; padding: 32px; 
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;
        }
        .score-banner h2 { margin: 0 0 8px 0; font-size: 2rem; }
        .score-banner p { margin: 0; color: #9CA3AF; font-family: 'JetBrains Mono', monospace; word-break: break-all; }
        
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .card { background-color: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .card h3 { margin: 0 0 16px 0; font-size: 1.2rem; }
        
        .good-card h3 { color: #059669; }
        .bad-card h3 { color: #DC2626; }
        
        .card ul { padding-left: 20px; margin: 0; color: #4B5563; }
        .card li { margin-bottom: 12px; }

        @media (max-width: 768px) {
            .search-box { flex-direction: column; }
            .grid-layout { grid-template-columns: 1fr; }
            .score-banner { flex-direction: column; text-align: center; gap: 24px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="/../products/index.html" class="back-link">← Back to Haim International</a>
        
        <h1>SiteFlare Diagnostics</h1>
        <p class="subtitle">Run a quantitative audit on your marketing architecture and AI crawler readiness.</p>
        
        <form class="search-box" id="audit-form">
            <input type="url" id="query-input" placeholder="https://www.example.com" required>
            <button type="submit" id="submit-btn">Run Audit</button>
        </form>

        <div id="error-message"></div>

        <div id="results-dashboard">
            <div class="score-banner">
                <div>
                    <h2>Diagnostic Complete</h2>
                    <p id="target-url">Target: </p>
                </div>
                <div style="text-align: right;">
                    <span id="total-score" style="display: block; font-size: 3rem; font-weight: 700; color: #EA580C;"></span>
                    <span style="font-size: 0.8rem; text-transform: uppercase; color: #9CA3AF; letter-spacing: 1px;">AI-Readiness Grade</span>
                </div>
            </div>

            <div class="grid-layout">
                <div class="card good-card">
                    <h3>✓ Where You Shine</h3>
                    <ul id="strengths-list"></ul>
                </div>
                <div class="card bad-card">
                    <h3>⚠ Critical Action Items</h3>
                    <ul id="action-items-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('audit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const targetUrl = document.getElementById('query-input').value;
            const btn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-message');
            const dashboard = document.getElementById('results-dashboard');
            
            btn.disabled = true;
            btn.textContent = "Scanning...";
            errorDiv.style.display = "none";
            dashboard.style.display = "none";

            try {
                const response = await fetch("http://127.0.0.1:8000/api/audit", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "omit", 
                    body: JSON.stringify({ url: targetUrl }) 
                });

                if (!response.ok && response.headers.get("content-type")?.indexOf("application/json") === -1) {
                    throw new Error("Backend server error. Ensure Uvicorn is running on port 8000.");
                }

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || "Failed to complete website audit.");
                }

                const scorecard = data.scorecard;
                document.getElementById('target-url').textContent = "Target: " + targetUrl;
                
                // Matches the new backend JSON key
                document.getElementById('total-score').textContent = scorecard.ai_readiness_grade || "N/A";

                // Populate Strengths
                const strengthsUl = document.getElementById('strengths-list');
                strengthsUl.innerHTML = "";
                if (scorecard.strengths && scorecard.strengths.length > 0) {
                    scorecard.strengths.forEach(item => {
                        strengthsUl.innerHTML += `<li>${item}</li>`;
                    });
                } else {
                    strengthsUl.innerHTML = "<li>No significant AI-readiness strengths detected.</li>";
                }

                // Populate Action Items
                const actionsUl = document.getElementById('action-items-list');
                actionsUl.innerHTML = "";
                if (scorecard.action_items && scorecard.action_items.length > 0) {
                    scorecard.action_items.forEach(item => {
                        actionsUl.innerHTML += `<li>${item}</li>`;
                    });
                } else {
                    actionsUl.innerHTML = "<li>Your architecture is perfectly optimized for AI crawlers!</li>";
                }

                dashboard.style.display = "block";

            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.textContent = "Run Audit";
            }
        });
    </script>
</body>
</html>
