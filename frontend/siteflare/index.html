<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiteFlare | Haim International</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* UNIVERSAL GLOBAL STYLES */
        body { font-family: 'Inter', sans-serif; background-color: #FAF9F6; color: #111827; margin: 0; padding: 0; line-height: 1.6; }
        
        header { padding: 40px 40px 0 40px; border-bottom: 1px solid #E5E7EB; max-width: 1200px; margin: 0 auto; }
        .nav-links { display: flex; gap: 32px; padding-bottom: 16px; }
        .nav-links a { 
            text-decoration: none; color: #6B7280; font-weight: 600; font-size: 0.9rem; 
            text-transform: uppercase; letter-spacing: 1px; transition: color 0.2s; 
            padding-bottom: 16px; border-bottom: 2px solid transparent; 
        }
        .nav-links a:hover { color: #111827; }
        .nav-links a.active { color: #EA580C; border-bottom: 2px solid #EA580C; }

        /* UNIVERSAL TOOL LAYOUT */
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 40px; }
        .back-link {
            display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; 
            color: #6B7280; text-decoration: none; text-transform: uppercase; margin-bottom: 40px; transition: color 0.2s;
        }
        .back-link:hover { color: #EA580C; }
        
        h1 { font-size: 3rem; font-weight: 700; margin: 0 0 16px 0; letter-spacing: -1px; }
        p.subtitle { font-size: 1.25rem; color: #4B5563; margin-bottom: 40px; }
        
        /* TOOL SPECIFIC ELEMENTS */
        .search-box { display: flex; gap: 16px; margin-bottom: 40px; }
        input[type="url"], input[type="text"] {
            flex: 1; padding: 16px 24px; font-size: 1.1rem; border: 1px solid #E5E7EB; 
            border-radius: 8px; font-family: 'Inter', sans-serif; outline: none;
        }
        input:focus { border-color: #EA580C; }
        button {
            padding: 16px 32px; background-color: #EA580C; color: white; border: none; 
            border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background-color 0.2s;
        }
        button:hover { background-color: #C2410C; }
        button:disabled { background-color: #FCA5A5; cursor: not-allowed; }

        #error-message { display: none; background-color: #FEE2E2; color: #991B1B; padding: 16px; border-radius: 8px; margin-bottom: 24px; border: 1px solid #F87171; }
        #results-dashboard { display: none; }
        
        .score-banner { background-color: #111827; color: white; border-radius: 12px; padding: 32px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .score-banner h2 { margin: 0 0 8px 0; font-size: 2rem; }
        .score-banner p { margin: 0; color: #9CA3AF; font-family: 'JetBrains Mono', monospace; }
        
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .card { background-color: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .card h3 { margin: 0 0 16px 0; font-size: 1.2rem; }
        .metric-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #F3F4F6; }
        .metric-label { font-weight: 500; color: #374151; }
        .metric-val { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #EA580C; }

        @media (max-width: 768px) {
            header { padding: 20px 20px 0 20px; }
            .nav-links { gap: 16px; overflow-x: auto; white-space: nowrap; }
            .search-box { flex-direction: column; }
            .grid-layout { grid-template-columns: 1fr; }
            .score-banner { flex-direction: column; text-align: center; gap: 24px; }
            .container { padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <nav class="nav-links">
            <a href="../home/index.html">HOME</a>
            <a href="#">ABOUT</a>
            <a href="../products/index.html" class="active">PRODUCTS</a>
            <a href="#">SERVICES</a>
        </nav>
    </header>

    <div class="container">
        <a href="../products/index.html" class="back-link">← Back to Products</a>
        
        <h1>SiteFlare</h1>
        <p class="subtitle">Quantitative audit on marketing architecture, SEO technicals, and AI crawler readiness.</p>
        
        <form class="search-box" id="audit-form">
            <input type="url" id="url-input" placeholder="https://example.com" required>
            <button type="submit" id="submit-btn">Run Audit</button>
        </form>

        <div id="error-message"></div>

        <div id="results-dashboard">
            <div class="score-banner">
                <div>
                    <h2>Audit Complete</h2>
                    <p id="target-url">Target: </p>
                </div>
                <div style="text-align: right;">
                    <span id="total-score" style="display: block; font-size: 3rem; font-weight: 700; color: #EA580C;"></span>
                    <span style="font-size: 0.8rem; text-transform: uppercase; color: #9CA3AF; letter-spacing: 1px;">Overall Score / 100</span>
                </div>
            </div>

            <div class="grid-layout">
                <div class="card">
                    <h3>Performance & SEO</h3>
                    <div id="seo-metrics-container"></div>
                </div>
                <div class="card">
                    <h3>Technical Architecture</h3>
                    <div id="tech-metrics-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('audit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('url-input').value;
            const btn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-message');
            const dashboard = document.getElementById('results-dashboard');
            
            btn.disabled = true;
            btn.textContent = "Auditing...";
            errorDiv.style.display = "none";
            dashboard.style.display = "none";

            try {
                const response = await fetch("http://127.0.0.1:8000/api/audit", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: url })
                });

                if (!response.ok && response.headers.get("content-type")?.indexOf("application/json") === -1) {
                    throw new Error("Backend server error. Ensure Uvicorn is running on port 8000.");
                }

                const data = await response.json();
                if (!response.ok || data.error) throw new Error(data.error || "Failed to complete audit.");

                const scorecard = data.scorecard;
                document.getElementById('target-url').textContent = "Target: " + url;
                document.getElementById('total-score').textContent = scorecard.total_score || "--";
                
                document.getElementById('seo-metrics-container').innerHTML = `
                    <div class="metric-row"><span class="metric-label">Load Speed</span><span class="metric-val">Checked</span></div>
                    <div class="metric-row"><span class="metric-label">Meta Tags</span><span class="metric-val">Checked</span></div>
                `;
                document.getElementById('tech-metrics-container').innerHTML = `
                    <div class="metric-row"><span class="metric-label">Mobile Friendly</span><span class="metric-val">Checked</span></div>
                    <div class="metric-row"><span class="metric-label">Tracking Pixels</span><span class="metric-val">Checked</span></div>
                `;

                dashboard.style.display = "block";
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.textContent = "Run Audit";
            }
        });
    </script>
</body>
</html>
